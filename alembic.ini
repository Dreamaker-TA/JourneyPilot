; JourneyPilot 版本化迁移配置。
;
; **不要在这里写 sqlalchemy.url。** 数据库地址的唯一定义处是 config.yaml /
; 环境变量（见 travel_agent/config.py::DatabaseConfig），migrations/env.py 从那里读。
; 在这里再写一份 URL 就意味着「迁移连的库」和「应用连的库」可以不是同一个库 ——
; 那是这类工具最经典的一种数据事故。
;
; 日常不要直接敲 `alembic`，用 CLI：
;   uv run python journeypilot.py db status
;   uv run python journeypilot.py migrate
; CLI 负责 census、备份、迁移锁和破坏性迁移授权，裸 alembic 命令全部跳过这些闸门。

[alembic]
script_location = migrations
prepend_sys_path = src:.
path_separator = os
# revision 文件名前缀用递增序号而不是时间戳：本地单用户产品的迁移是一条直线，
# 序号能让人一眼读出顺序。
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
