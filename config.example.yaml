# JourneyPilot example config
# Copy this file to config.yaml and fill in your own values.

env: development
debug: false

primary_model:
  api_key: ""
  model_name: "deepseek-v4-pro"
  base_url: "https://api.deepseek.com"
  max_tokens: 32768
  temperature: 0.7
  timeout: 120

fast_model:
  api_key: ""
  model_name: "deepseek-v4-flash"
  base_url: "https://api.deepseek.com"
  max_tokens: 32768
  temperature: 0.5
  timeout: 30

# RAG vectorisation. Three providers, and which keys matter depends on which one:
# - "qwen3" (default): local Qwen3-Embedding-0.6B ONNX. Downloads ~1.2GB from HuggingFace
#   on first start; api_key / base_url are unused.
# - "openai": any OpenAI-compatible embedding endpoint. Then api_key and base_url are
#   the two you must fill in — README's config table points here for exactly this swap.
# - "hash": built-in deterministic hash vectors. Zero dependencies, poor semantics;
#   only for getting the RAG path to run end to end.
# dimensions must match the model you point at, and must match the pgvector column
# your database was created with — changing it later means re-indexing.
# Env overrides: EMBEDDING_PROVIDER / EMBEDDING_MODEL_NAME / EMBEDDING_BASE_URL /
# EMBEDDING_API_KEY / EMBEDDING_DIMENSIONS.
embedding:
  provider: "qwen3"
  api_key: ""                                          # openai provider only
  model_name: "n24q02m/Qwen3-Embedding-0.6B-ONNX"      # e.g. "text-embedding-3-small" for openai
  base_url: "https://api.openai.com/v1"                # openai provider only
  dimensions: 1024                                     # 1536 for text-embedding-3-small

# Dual-track host ports (see README Quick Start):
# - This example defaults to 5433/6379 for a local non-compose instance / walkthrough.
# - This repo's docker-compose.yml maps Postgres 55433:5432 and Redis 16379:6379.
#   When using that stack from the host (./run.sh backend, psql, integration tests),
#   set database.port: 55433 and redis.port: 16379 here (or in your config.yaml).
database:
  host: "localhost"
  port: 5433
  name: "travel_agent"
  user: "travel_agent"
  password: "travel_agent_pwd"
  pool_size: 10
  max_overflow: 20

# Backup / migration / restore. Only the `journeypilot` CLI reads this section —
# the API process never modifies the schema or the physical database.
maintenance:
  # Backup root. A relative path resolves against the repository root, not the
  # current working directory: which directory you type the command from must not
  # change where backups land.
  backup_dir: "backups"
  # How many *automatic* (pre-upgrade) backups to keep. Manual backups made with
  # `journeypilot backup` are never deleted automatically.
  keep_automatic_backups: 5
  # Container that runs pg_dump / pg_restore. Empty = auto-detect by "who publishes
  # the database port". Set it explicitly when several PostgreSQL containers share
  # a port mapping on one machine.
  # Why this exists: pg_dump refuses to dump a server newer than itself, and the
  # host client is often older than the server in Compose. Backups run with a
  # version-matched client or not at all.
  postgres_container: ""
  # Seconds to wait for the migration advisory lock. On timeout the command fails —
  # it never proceeds without the lock.
  migration_lock_timeout_seconds: 30

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

# Cross-process cache for strictly scoped, evidence-eligible Provider facts.
# Redis loss only causes a live miss; it never replays old Candidates or Bundles.
provider_snapshot_cache:
  enabled: true
  redis_key_prefix: "journeypilot:provider-snapshot:v1"
  redis_timeout_seconds: 0.25
  place_identity_ttl_seconds: 604800
  route_ttl_seconds: 300

server:
  host: "0.0.0.0"
  port: 8001
  reload: true
  log_level: "info"
  allow_runtime_model_config: false
  cors_origins:
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"

rag:
  chunk_size: 500
  chunk_overlap: 50
  top_k: 5
  score_threshold: 0.3
  chunker_type: "contextual"        # "text" | "semantic" | "contextual"
  semantic_split_threshold: 0.5
  # Bounds on model-calling chunking. semantic/contextual spend one
  # embedding per sentence and one fast-model call per chunk, so the call count
  # scales with the uploaded document. Retry/backoff is NOT here: that is the
  # transport's job (openai SDK, exponential, max_retries=2). Concurrency is not
  # here either — it belongs to provider_channels.ingest_contextual_llm below.
  model_chunking_max_chars: 60000   # above this: zero model calls, fixed-window chunking
  contextual_failure_threshold: 8   # failures in one document before the rest skip the LLM

# Tool Search: deferred workers get a compact tool catalog + search_tools;
# full injects every tool schema (debug fallback). Defaults match Settings.tool_exposure.
tool_exposure:
  mode: "deferred"          # "deferred" | "full"
  worker_only: true
  min_tools_threshold: 8

# Plan gate pause before Deep Research workers. Default true.
run_control:
  plan_gate_enabled: true
  # 执行租约（过期即由恢复扫描接管该 run）。心跳必须小于租约的一半。
  lease_seconds: 45
  lease_heartbeat_seconds: 10
  lease_heartbeat_failure_threshold: 3
  recovery_sweep_seconds: 60
  # 取消 / 追加要求先落 trip_run_commands，执行器按这个间隔轮询（同进程会被立即唤醒）。
  command_poll_seconds: 2.0

# SSE 缓冲的内存预算（Settings.streaming）。
streaming:
  critical_queue_size: 128
  max_coalesced_chunk_chars: 2048
  max_pending_text_chars: 65536
  heartbeat_seconds: 15.0
  # 生产者等消费者腾位置的上限；超过即结束传输，状态以 durable 记录为准。
  stalled_consumer_seconds: 30.0

# 后台任务 worker（记忆抽取等，落 background_jobs）。
background_jobs:
  poll_seconds: 5.0
  lease_seconds: 60
  batch_size: 1
  # 已完成任务的保留天数；dead 任务不清理，留到用户确认。
  completed_retention_days: 30

# 同步工作被赶出 Event Loop 之后的并发上限（services/blocking_work.py）。
# 排满时调用方等 queue_wait_seconds，然后收到「现在太忙」而不是无限排队。
blocking_work:
  pdf_export: 1
  document_parse: 2
  local_embedding: 2
  cpu_projection: 2
  queue_wait_seconds: 30.0

# 上传与文档解析的硬输入边界（rag/sources/document_parse.py）。
# DOCX 是 ZIP：只限制上传字节挡不住一份展开后有几个 GB 的文件，所以要判展开量与压缩比。
ingest:
  max_upload_bytes: 10485760        # 10 MB
  max_pdf_pages: 500
  max_docx_entries: 5000
  max_uncompressed_bytes: 104857600 # 100 MB，ZIP 全部条目解压后的总量
  max_compression_ratio: 100.0      # zip bomb 的判据是比值
  max_extracted_chars: 2000000      # 超过即截断并在回执里说明
  # 解析走受限子进程：线程里的解析器杀不掉，超时只停止等待。
  parse_timeout_seconds: 60.0
  parse_cpu_seconds: 60             # 0 = 不设（非 POSIX 平台自动跳过）
  parse_address_space_bytes: 2147483648

# 一次 Run 允许花掉多少（Run 被授权时封存快照，之后改这里不影响在跑的 Run）。
# 墙钟不在这里：它由 RunDeadlineSnapshot 一处拥有（STA_DEADLINE_* 环境变量）。
run_budget:
  max_llm_calls: 100
  max_tool_calls: 150
  max_input_tokens: 1000000
  max_output_tokens: 100000
  max_cost_usd: 5.0
  max_tool_retries_per_target: 2

# 按上游通道分配的同时在飞条数。连接池容量不是产品预算：
# ingest_contextual_llm 与 online_fast_llm 走同一个 fast 上游，配额必须分开，
# 否则一次资料上传就能把在线请求排到队尾。
provider_channels:
  primary_research_llm: 6
  online_fast_llm: 8
  ingest_contextual_llm: 4
  embedding: 4

# Hybrid RAG second-stage rerank (Settings.rerank). llm needs no extra install.
rerank:
  enabled: true
  provider: "llm"           # "llm" | "cross_encoder"
  model_name: "BAAI/bge-reranker-v2-m3"
  initial_top_k: 20
  final_top_k: 5

# OSM place providers: Nominatim + Overpass (Settings.geocoding).
geocoding:
  nominatim_base_url: "https://nominatim.openstreetmap.org"
  user_agent: "JourneyPilot/1.0 (travel itinerary geocoder; https://github.com/journeypilot)"
  # Baseline timeout for /lookup (batch osm_id, bilingual) and Overpass; both run
  # only in the identity fallback, off the first-hop synchronous path.
  timeout_seconds: 10.0
  # Shorter per-attempt timeout for /search, the blocking hop when a user submits a
  # destination. Measured healthy round trips here: 0.77 / median 1.34 / worst 2.51s.
  # Upper bound is the ladder: min_interval_seconds + 2 attempts must stay under 8s
  # worst case, so 1.1 + 2 x 3.4 = 7.9s makes 3.4 the largest per-attempt timeout.
  search_timeout_seconds: 3.4
  # Public Nominatim allows <=1 req/s; 1.1s leaves headroom (global serial rate gate).
  min_interval_seconds: 1.1
  # Reuse window for raw /search responses in the Redis-backed cache. OSM city/station
  # relations do not move, so 7 days matches provider_snapshot_cache.place_identity_ttl_seconds.
  search_cache_ttl_seconds: 604800
  search_cache_key_prefix: "journeypilot:nominatim-search:v1"
  # Cache lookups must not become a new stall: a slow Redis is treated as a miss.
  search_cache_redis_timeout_seconds: 0.25

# Street / public-transit routing providers (Settings.routing).
# One tool (`global_route_search`), two upstreams split by geography: amap answers
# inside the China coordinate box, MOTIS/Transitous answers the rest of the world.
# The split is a coverage fact, not a preference — MOTIS carries no mainland-China
# transit feed (measured: zero routes visited for a 7.9 km Shenzhen hop),
# and amap covers nowhere else. amap reuses the AMAP_MAPS_API_KEY configured on the
# `amap-maps` MCP server below; there is no second place to put that key.
routing:
  transitous_base_url: "https://api.transitous.org"
  amap_base_url: "https://restapi.amap.com"
  user_agent: "JourneyPilot/2.0 (https://github.com/journeypilot)"
  timeout_seconds: 20.0
  min_interval_seconds: 1.0

# Committed upstream data snapshots (Settings.data_snapshots).
# 12306 publishes station_name.js with no version token, so age is the only proxy
# available: this is how long the repo will answer station questions from a table
# nobody re-checked. Reported by /api/health/ready as a non-blocking component and
# by preflight item 4 — never blocks readiness.
data_snapshots:
  station_max_age_days: 90

# LangGraph checkpoint retention days (Settings.checkpoint_retention).
# require_on_startup=true → AppBuilder fails hard if Postgres checkpointer init fails.
checkpoint_retention:
  completed_days: 30
  cancelled_days: 30
  failed_interrupted_days: 90
  batch_size: 100
  require_on_startup: false

model_pricing:
  - pattern: "deepseek-v4-flash"
    provider: deepseek
    input_per_1m: 0.14
    cached_input_per_1m: 0.0028
    output_per_1m: 0.28
    currency: USD
    effective_from: "2026-07-03"
    source_url: "https://api-docs.deepseek.com/quick_start/pricing"
  - pattern: "deepseek-v4-pro"
    provider: deepseek
    input_per_1m: 0.435
    cached_input_per_1m: 0.003625
    output_per_1m: 0.87
    currency: USD
    effective_from: "2026-07-03"
    source_url: "https://api-docs.deepseek.com/quick_start/pricing"

logging:
  level: "info"
  file:
    enabled: true
    path: "logs/"
    rotation: "1 day"
    retention: "7 days"

mcp:
  servers:
    baidu-maps:
      env:
        BAIDU_MAP_API_KEY: ""
      # sse_url: "https://mcp.map.baidu.com/sse?ak=YOUR_AK"

    duckduckgo-search:
      disabled: false

    tavily-search:
      env:
        TAVILY_API_KEY: ""

    brave-search:
      env:
        BRAVE_API_KEY: ""

    firecrawl:
      env:
        FIRECRAWL_API_KEY: ""

    amap-maps:
      env:
        AMAP_MAPS_API_KEY: ""
      # 两次调用之间的最小间隔（秒），默认 0 = 不限速。高德按「每秒并发」拒绝
      # （CUQPS_HAS_EXCEEDED_THE_LIMIT），而一次这样的拒绝会让整个住宿域少掉候选。
      # 数值请到高德控制台读当前 key 的 QPS 上限后填这里，不要写进代码：
      # 3 QPS → 0.34，5 QPS → 0.2。留 0 表示不限速。
      min_interval_seconds: 0

    duffel-flights:
      env:
        DUFFEL_API_KEY_LIVE: ""

    12306-train: {}

    open-meteo: {}

    currency-exchange-mcp: {}
